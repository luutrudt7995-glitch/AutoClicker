name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable & fix wrapper
        run: |
          chmod +x gradlew
          curl -L "https://services.gradle.org/distributions/gradle-8.2-bin.zip" -o gradle-bin.zip
          unzip -q gradle-bin.zip
          mkdir -p gradle/wrapper
          cp gradle-8.2/lib/plugins/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          find gradle-8.2 -name "gradle-wrapper.jar" -exec cp {} gradle/wrapper/gradle-wrapper.jar \;

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
