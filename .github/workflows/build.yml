name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradle wrapper jar
        run: |
          cd $RUNNER_TEMP
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          cd $GITHUB_WORKSPACE
          mkdir -p gradle/wrapper
          find $RUNNER_TEMP/gradle-8.2 -name "gradle-wrapper.jar" | head -1 | xargs -I{} cp {} gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          echo "JAR copied:"
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
